[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-T5jF2yC6ydDwG24A+OAFH4BHQFG2VvXneHn45R3vxZA='; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; worker-src 'none'; manifest-src 'self'; media-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), hid=(), midi=(), display-capture=(), magnetometer=(), gyroscope=(), accelerometer=(), interest-cohort=(), browsing-topics=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"
    X-Robots-Tag = "noindex, nofollow"            # demo: also covers images and JSON. Remove at go-live

# Images keep their file names when they are replaced (new photos, new logo), so they must revalidate.
# A long max-age here also pinned a 404 for a logo that was uploaded a few minutes after the page that used it.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Code and data are not fingerprinted, so browsers must check with the server on every load (a cheap 304 when nothing changed).
# A cached max-age here can pair a new page with an old script and break it until the cache expires.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Clean URLs for the generated pages (shop.html -> /shop, prodotti/x.html -> /prodotti/x ...).
# /shop and /servizi are forced because /servizi is also a folder; the other two only apply when no file exists at that path.
[[redirects]]
  from = "/shop"
  to = "/shop.html"
  status = 200
  force = true

[[redirects]]
  from = "/shop/"
  to = "/shop.html"
  status = 200
  force = true

[[redirects]]
  from = "/servizi"
  to = "/servizi.html"
  status = 200
  force = true

[[redirects]]
  from = "/servizi/"
  to = "/servizi.html"
  status = 200
  force = true

[[redirects]]
  from = "/prodotti/:slug"
  to = "/prodotti/:slug.html"
  status = 200

[[redirects]]
  from = "/servizi/:slug"
  to = "/servizi/:slug.html"
  status = 200

# publish = "." serves the whole repository: answer 404 for files that are not part of the site.
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/404.html"
  status = 404
  force = true
